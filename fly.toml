app            = "DITT-APP-NAMN"
primary_region = "arn"

[build]

[env]
  PORT     = "8080"
  DATA_DIR = "/data"

[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = true
  auto_start_machines  = true
  min_machines_running = 0

[[mounts]]
  source      = "notes_data"
  destination = "/data"
